version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: baremind_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-baremind_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-baremind_password}
      POSTGRES_DB: ${POSTGRES_DB:-baremind_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - baremind_net

  meilisearch:
    image: getmeili/meilisearch:v1.10
    container_name: baremind_meilisearch
    restart: always
    environment:
      - MEILI_MASTER_KEY=${MEILISEARCH_MASTER_KEY:-masterKey123!}
      - MEILI_ENV=development
    ports:
      - "7700:7700"
    volumes:
      - meilisearch_data:/meili_data
    networks:
      - baremind_net

  pgadmin:
    image: dpage/pgadmin4
    container_name: baremind_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@baremind.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - baremind_net

  redis:
    image: redis:7-alpine
    container_name: baremind_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - baremind_net

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: baremind_redis_commander
    restart: always
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis
    networks:
      - baremind_net

  mailpit:
    image: axllent/mailpit
    container_name: baremind_mailpit
    restart: always
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - baremind_net

  # ─── Kafka (KRaft mode — no Zookeeper needed) ─────────────────────────────
  kafka:
    image: apache/kafka:3.8.0
    container_name: baremind_kafka
    restart: always
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - baremind_net

  # ─── Kafka UI (optional but very handy) ───────────────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: baremind_kafka_ui
    restart: always
    ports:
      - "8082:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=baremind
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092
    depends_on:
      - kafka
    networks:
      - baremind_net

networks:
  baremind_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  meilisearch_data:
